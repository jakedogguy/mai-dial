[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mai"
version = "0.1.0"
description = "Turn a YouTube video's tracklist into a Tidal playlist."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "@jakedogguy" }]
dependencies = [
    "yt-dlp",
    "tidalapi>=0.8",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mai = "mai.cli:main"

[tool.setuptools]
packages = ["mai"]
